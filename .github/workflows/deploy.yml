name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Test API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test web app
        working-directory: frontend
        run: |
          npm ci
          npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Pack release
        run: |
          mkdir -p dist
          tar -C frontend -czf dist/web.tar.gz dist
          tar --exclude='__pycache__' --exclude='tests' --exclude='data' --exclude='logs' --exclude='.venv' --exclude='.env' \
            -czf dist/backend.tar.gz backend
          cp deploy/smartbook-backend.service dist/

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Copy release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "/root/smartbook-summaries/tmp-deploy"
          strip_components: 1

      - name: Install and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OPENROUTER_KEY
          script: |
            set -e
            APP=/root/smartbook-summaries
            TMP=$APP/tmp-deploy
            WEB=/var/www/book.ansarisaif.com
            mkdir -p $APP/data
            tar -xzf $TMP/backend.tar.gz -C $APP
            [ -x $APP/backend/.venv/bin/python ] || python3 -m venv $APP/backend/.venv
            $APP/backend/.venv/bin/pip install -q -r $APP/backend/requirements.txt
            umask 077
            touch $APP/backend/.env
            if [ -n "${OPENROUTER_KEY}" ]; then
              grep -v '^OPENROUTER_KEY=' $APP/backend/.env > $APP/backend/.env.tmp || true
              printf 'OPENROUTER_KEY=%s\n' "${OPENROUTER_KEY}" >> $APP/backend/.env.tmp
              mv $APP/backend/.env.tmp $APP/backend/.env
            fi
            chmod 600 $APP/backend/.env
            umask 022
            rm -rf $WEB.new && mkdir -p $WEB.new
            tar -xzf $TMP/web.tar.gz -C $WEB.new --strip-components=1
            rm -rf $WEB.old && { [ -d $WEB ] && mv $WEB $WEB.old || true; } && mv $WEB.new $WEB && rm -rf $WEB.old
            install -m 644 $TMP/smartbook-backend.service /etc/systemd/system/smartbook-backend.service
            rm -rf $TMP
            systemctl daemon-reload
            systemctl enable --quiet smartbook-backend
            systemctl restart smartbook-backend
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8082/health >/dev/null; then exit 0; fi
              sleep 2
            done
            journalctl -u smartbook-backend -n 80 --no-pager || true
            exit 1
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
